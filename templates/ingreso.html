{% extends "base.html" %}
{% block title %}Ingreso — Inventario Bodega{% endblock %}
{% block content %}
<div class="page-title">Ingreso de stock</div>

<div class="card" style="max-width:560px;">
  <form method="post" id="form-ingreso">
    <div class="form-row">
      <div class="form-group">
        <label for="turno">Código de persona / turno</label>
        <select id="turno" name="turno" onchange="toggleTurnoOtro()" required>
          <option value="">Selecciona</option>
          {% for t in TURNOS %}
            <option value="{{ t }}">{{ t }}</option>
          {% endfor %}
          <option value="otro">Otro…</option>
        </select>
      </div>
      <div class="form-group" id="bloque-turno-otro" style="display:none;">
        <label for="turno_otro">Especifica el código</label>
        <input type="text" id="turno_otro" name="turno_otro">
      </div>
      <div class="form-group">
        <label for="fecha">Fecha de ingreso</label>
        <input type="date" id="fecha" name="fecha" value="{{ hoy }}" required>
      </div>
    </div>

    <div class="form-group">
      <label>
        <input type="radio" name="modo" value="existente" checked onclick="toggleModo()"> Ingreso a componente existente
      </label><br>
      <label>
        <input type="radio" name="modo" value="nuevo" onclick="toggleModo()"> Crear componente nuevo
      </label>
    </div>

    <div id="bloque-existente">
      <div class="form-group">
        <label for="componente_id">Componente</label>
        <select id="componente_id" name="componente_id">
          <option value="">Selecciona un componente</option>
          {% for c in componentes %}
            <option value="{{ c['id'] }}">
              {{ c['codigo'] }} — {{ c['nombre'] }} (stock: {{ c['cantidad'] }})
            </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div id="bloque-nuevo" style="display:none;">
      <p class="hint">Alta rápida de un componente nuevo. Para más campos (descripción, etc.) usa
        <a href="{{ url_for('componente_nuevo') }}">el formulario completo de componentes</a>.</p>
      <div class="form-row">
        <div class="form-group">
          <label for="codigo">Código SAP</label>
          <input type="text" id="codigo" name="codigo">
        </div>
        <div class="form-group">
          <label for="nombre">Nombre de componente</label>
          <input type="text" id="nombre" name="nombre">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="categoria">Categoría</label>
          <input type="text" id="categoria" name="categoria">
        </div>
        <div class="form-group">
          <label for="ubicacion">Ubicación</label>
          <input type="text" id="ubicacion" name="ubicacion">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="stock_minimo">Stock mínimo</label>
          <input type="number" id="stock_minimo" name="stock_minimo" min="0" value="0" style="max-width:160px;">
        </div>
        <div class="form-group">
          <label for="lead_time_dias">Lead time (días para reponer)</label>
          <input type="number" id="lead_time_dias" name="lead_time_dias" min="0" value="0" style="max-width:160px;">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="cantidad">Cantidad a ingresar</label>
      <input type="number" id="cantidad" name="cantidad" min="1" required style="max-width:160px;">
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Registrar ingreso</button>
      <a href="{{ url_for('inicio') }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

<script>
function toggleModo() {
  var modo = document.querySelector('input[name="modo"]:checked').value;
  document.getElementById('bloque-existente').style.display = modo === 'existente' ? 'block' : 'none';
  document.getElementById('bloque-nuevo').style.display = modo === 'nuevo' ? 'block' : 'none';
}
function toggleTurnoOtro() {
  var val = document.getElementById('turno').value;
  document.getElementById('bloque-turno-otro').style.display = val === 'otro' ? 'block' : 'none';
}
</script>
{% endblock %}
